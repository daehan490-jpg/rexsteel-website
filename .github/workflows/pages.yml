name: Deploy Rexsteel website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare public files
        run: |
          mkdir -p "$RUNNER_TEMP/rexsteel-public"
          cp -- *.html *.css *.js .nojekyll "$RUNNER_TEMP/rexsteel-public/"
          cp -R assets files "$RUNNER_TEMP/rexsteel-public/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/rexsteel-public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
